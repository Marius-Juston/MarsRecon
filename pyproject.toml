[project]
name = "marsrecon"
version = "0.1.0"
description = "Mars HiRISE dataset manager for crater segmentation"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.9",
    "pandas-stubs>=3.0.0.260204",
    "pdr>=1.4.1",
    "pyarrow>=23.0.1",
    "torchgeo>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real HiRISE data on disk",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
precision = 1
