[project]
name = "marsrecon"
version = "0.1.0"
description = "Mars HiRISE dataset manager for crater segmentation"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.9",
    "huggingface-hub>=1.8.0",
    "pandas-stubs>=3.0.0.260204",
    "pdr>=1.4.1",
    "pyarrow>=23.0.1",
    "torch==2.10",
    "torchgeo>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
    "pytest-xdist[psutil]>=3.8.0",
]
experiment = [
    "wandb>=0.19",
]
depthfm = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "jsonargparse[signatures]>=4.47.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "rasterio>=1.5.0",
    "safetensors>=0.7.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tifffile>=2026.3.3",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.0",
    "wandb>=0.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real HiRISE data on disk",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/validate_sampling.py",
    "src/build_marsclip_split_manifest.py",
    "src/compute_dataset_stats.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
