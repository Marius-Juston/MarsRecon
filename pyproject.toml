[project]
name = "marsrecon"
version = "0.1.0"
description = "Mars HiRISE dataset manager for crater segmentation"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.9",
    "huggingface-hub>=1.8.0",
    "pandas-stubs>=3.0.0.260204",
    "pdr>=1.4.1",
    "pyarrow>=23.0.1",
    "torch==2.10",
    "torchgeo>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
    "pytest-xdist[psutil]>=3.8.0",
]
experiment = [
    "wandb>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real HiRISE data on disk",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/validate_sampling.py",
    "src/build_marsclip_split_manifest.py",
    "src/compute_dataset_stats.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
