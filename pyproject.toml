[project]
name = "marsrecon"
version = "0.1.0"
description = "Mars HiRISE dataset manager for crater segmentation"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.9",
    "huggingface-hub>=1.8.0",
    "pandas-stubs>=3.0.0.260204",
    "pdr>=1.4.1",
    "pyarrow>=23.0.1",
    "scipy>=1.17.1",
    "squarify>=0.4.4",
    "torch>=2.10",
    "torchgeo>=0.9.0",
    "wordcloud>=1.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
    "pytest-xdist[psutil]>=3.8.0",
]
experiment = [
    "wandb>=0.19",
]
depthfm = [
    "accelerate>=1.13.0",
    "cuml-cu13>=26.4.0",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "focal-frequency-loss>=0.3.0",
    "geoopt>=0.5.1",
    "jsonargparse[signatures]>=4.49.0",
    "lightning>=2.6.1",
    "litdata>=0.2.61",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.0.1",
    "pillow>=12.1.1",
    "pykrige>=1.7.3",
    "rasterio>=1.5.0",
    "safetensors>=0.7.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tifffile>=2026.3.3",
    "torch-shampoo",
    "torchdiffeq>=0.2.5",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.0",
    "umap-learn>=0.5.12",
    "wandb>=0.25.1",
    "xgboost>=3.2.0",
]
viz = [
    "cairosvg>=2.9.0",
    "graphviz>=0.21",
]
docs = [
    "properdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-mermaid2-plugin>=1.2",
    "mkdocs-glightbox>=0.4",
    "pymdown-extensions>=10.11",
    "pydeps>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real HiRISE data on disk",
    "slow: marks tests that take more than a few seconds (excluded by default in CI)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dataset/validation/sampling_diagnostics.py",
    "src/build_marsclip_split_manifest.py",
    "src/dataset/stats/compute_stats.py",
    "src/dataset/stats/compute_stats_litdata.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch-shampoo = { git = "https://github.com/facebookresearch/optimizers.git" }
