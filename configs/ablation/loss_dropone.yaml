# Mars DepthFM — Loss Drop-One Ablation Study
#
# Declarative spec read by scripts/run_ablation.py. The orchestrator launches
# every job here on a 2-lane scheduler (each lane = 2 GPUs of the 4-GPU box).
#
# Statistical design: each variant (baseline + 7 drop-ones) is run with the
# same 3 seeds {42, 1042, 2042}. The same seed across variants gives a paired
# comparison on data ordering and init — much lower variance than unpaired.

study_name: loss_dropone_v1
base_config: configs/train_hirise_large.yaml
output_root: /home/mjuston2/Documents/MarsRecon/outputs/ablation
project_name: mars-depthfm-ablation
group: loss_dropone_v1

# Seeds reused across every variant for paired comparison.
seeds: [42, 1042, 2042]

# Lanes: list of CUDA_VISIBLE_DEVICES strings. The orchestrator launches at
# most len(lanes) jobs in parallel; each gets the corresponding lane.
lanes:
  - "0,1"
  - "2,3"

# Per-variant config overrides (OmegaConf dotlist form).
# L0 is the baseline (no overrides).
variants:
  - id: L0
    label: Baseline (all losses)
    overrides: []
  - id: L1
    label: -velocity
    overrides: ["training.losses.velocity_weight=0"]
  - id: L2
    label: -normals
    overrides: ["training.losses.normals_weight=0"]
  - id: L3
    label: -grad
    overrides: ["training.losses.grad_weight=0"]
  - id: L4
    label: -photo
    overrides: ["training.losses.photo_weight=0"]
  - id: L5
    label: -huber
    overrides: ["training.losses.huber_weight=0"]
  - id: L6
    label: -laplacian
    overrides: ["training.losses.laplacian_weight=0"]
  - id: L7
    label: -ordinal
    overrides: ["training.losses.ordinal_weight=0"]

# Common overrides applied to every job (2 GPUs per lane).
common_overrides:
  - "training.num_gpus=2"

# Crash-detection thresholds for the failure watchdog. NOT a performance
# pruner — these only trigger on clear training failures (NaN, deadlock,
# no-learning init). Variants that hurt one metric but help another keep
# running to full budget.
watchdog:
  # Maximum wall-clock gap between successive val/* updates before declaring
  # the run deadlocked (seconds). Set generously to absorb slow validation.
  val_stall_timeout_seconds: 7200
  # Fraction of max_steps after which val/rmse_mean must drop below this
  # elevation-std threshold; else the run is marked diverged. The constant
  # is calibrated to the dataset's elevation std (~m) — set to None to disable.
  noskill_check_fraction: 0.20
  noskill_rmse_threshold: null   # null disables; orchestrator falls back to "any val/rmse_mean improvement"
  # Hard retry budget per job before marking failed permanently. Only spent on
  # *fresh* failures (no last.ckpt). Restarts from a checkpoint are tracked via
  # `resumes` instead and don't burn this budget.
  max_attempts: 3
  # SIGTERM-to-SIGKILL grace period when preempting a running job (shutdown,
  # lane disable, or watchdog kill). Lightning needs real time under DDP to
  # flush a multi-GB `last.ckpt`; set generously.
  shutdown_grace_seconds: 300

# Dynamic lane control: while the orchestrator is running you can release GPUs
# without losing W&B continuity or burning retry budget.
#
#   # release lane 2,3 (current job is SIGTERMed → checkpoints → re-queues)
#   uv run python scripts/training/run_ablation.py --spec configs/ablation/loss_dropone.yaml --disable-lane "2,3"
#
#   # let the current job on 2,3 finish, but don't start anything new there
#   uv run python scripts/training/run_ablation.py --spec configs/ablation/loss_dropone.yaml --drain-lane "2,3"
#
#   # give it back
#   uv run python scripts/training/run_ablation.py --spec configs/ablation/loss_dropone.yaml --enable-lane "2,3"
#
# These subcommands edit <output_root>/control/lanes.json atomically and exit;
# the running orchestrator re-reads the file each poll tick.
