# Mars DepthFM Training Configuration — SD 3.5 Medium (MMDiT-X)
# This backend starts from SD 3.5's pre-trained weights (no DepthFM ckpt).
# Native rectified flow matching. 4x A6000 + 128 cores.
#
# NOTE: SD 3.5 Medium is ~2.5B params. With bf16 + ZeRO-2, this fits on
# 4x A6000 but with tighter memory margins. LoRA is recommended unless
# you have a large Mars dataset (>50k tiles).

model:
  backend: "sd35"
  sd35_model_id: "stabilityai/stable-diffusion-3.5-medium"

  # Not used for sd35 backend
  depthfm_checkpoint: null
  vae_id: null

  # LoRA recommended for SD 3.5 (2.5B params is tight for full FT)
  use_lora: true
  lora_rank: 128
  lora_alpha: 128

  freeze_encoder: false
  gradient_checkpointing: true

data:
  latent_dir: "data/latents_sd35/train"
  val_latent_dir: "data/latents_sd35/val"
  train_image_dir: "data/train/images"
  train_dtm_dir: "data/train/dtms"
  train_confidence_dir: null
  val_image_dir: "data/val/images"
  val_dtm_dir: "data/val/dtms"

  # SD 3.5 VAE also uses 8x downscaling: 512px -> 64x64 latent
  resolution: 512
  dtm_normalization: "minmax"
  use_stereo_augmentation: true
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation_degrees: 10
  brightness_jitter: 0.1
  contrast_jitter: 0.1

training:
  # Smaller batch size for SD 3.5 (larger model)
  per_gpu_batch_size: 1
  gradient_accumulation_steps: 8
  num_gpus: 4
  max_steps: 50000

  learning_rate: 1.0e-4  # Higher LR for LoRA
  weight_decay: 0.01
  lr_scheduler: "cosine"
  lr_warmup_steps: 500
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  mixed_precision: "bf16"

  flow_matching:
    # SD 3.5 natively uses rectified flow, so these align perfectly
    timestep_sampling: "logit_normal"
    logit_normal_mean: 0.0
    logit_normal_std: 1.0
    noise_augmentation_alpha: 0.997
    sigma_min: 1.0e-4

  losses:
    velocity_weight: 1.0
    normals_weight: 0.1
    normals_start_step: 2000
    use_confidence_weighting: false

  val_every_steps: 1.0
  save_every_steps: 5000
  log_every_steps: 50
  num_val_samples: 4

  logger: "wandb"
  project_name: "mars-depthfm"
  run_name: "sd35-lora-v1"
  output_dir: "checkpoints/mars_depthfm_sd35"
  resume_from: null

  use_ema: true
  ema_decay: 0.9999
  num_workers: 32
  pin_memory: true
  prefetch_factor: 4

deepspeed:
  enabled: true
  config_path: "configs/deepspeed_zero2.json"
