# Mars DepthFM — Lightning Training with MarsHiRISEDTM
# SD 2.1 + DepthFM checkpoint | 4x A6000 + 128 cores

model:
  backend: "sd21"
  depthfm_checkpoint: "checkpoints/depthfm-v1.ckpt"
  vae_id: "runwayml/stable-diffusion-v1-5"
  use_lora: false
  freeze_encoder: false
  gradient_checkpointing: true

  torch_compile: true
  torch_compile_mode: "default"
  full_graph: true
  use_checkpoint: false

data:
  source: "hirise"

  hirise:
    root: "/scratch/mars_hirise_dtm"
    include_ortho: true
    ortho_type: "RED"
    ortho_scale: null
    download: false
    reuse_cache: true
    target: null
    bbox: [-150, 15, -90, 70]

  sampler:
    size: 0.009
    length: null   # patches per epoch (null = all available)

  # Train/val/test split
  split_fractions: [0.8, 0.1, 0.1]
  split_method: "geographic"   # "geographic" or "random"
  split_axis: "longitude"

  # K-fold (set from CLI: --n_folds 5 --fold_idx 0)
  n_folds: null
  fold_idx: 0

  # Pre-computed latents (null = encode on-the-fly)
  latent_dir: null

  resolution: 512
  dtm_normalization: "relative"
  stats_path: "dataset_stats/dtm/dataset_stats.json"
  random_flip: true
  brightness_jitter: 0.1

training:
  per_gpu_batch_size: 2
  gradient_accumulation_steps: 4
  num_gpus: 4
  max_steps: 50000

  learning_rate: 3.0e-4
  weight_decay: 0.01
  lr_scheduler: "cosine"
  lr_warmup_steps: 1000

  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  mixed_precision: "bf16"

  flow_matching:
    timestep_sampling: "logit_normal"
    logit_normal_mean: 0.0
    logit_normal_std: 1.0
    noise_augmentation_alpha: 0.997
    sigma_min: 1.0e-4

  losses:
    velocity_weight: 1.0
    normals_weight: 1000.0
    normals_start_step: 1000
    grad_weight: 100.0         # multi-scale gradient loss (no extra install)
    grad_start_step: 500
    grad_scales: [1, 2, 4]
    # Focal Frequency Loss (requires: pip install focal-frequency-loss)
    freq_weight: 0.0
    freq_start_step: 1000
    freq_alpha: 1.0

    use_confidence_weighting: true

  # Validation and checkpointing
  val_every_steps: 0.5
  save_every_steps: 500
  log_every_steps: 50
  num_val_samples: 8
  flow_vis_every_steps: 2
  train_vis_every_steps: 500

  # Test: use more Euler steps for best quality
  test_euler_steps: 4

  # Early stopping (null = disabled)
  early_stopping_patience: null

  # Logging
  logger: "wandb"
  project_name: "mars-depthfm"
  run_name: "sd21-hirise-v1"
  output_dir: "outputs/mars_depthfm_hirise"
  resume_from: null

  use_ema: true
  ema_decay: 0.9999

  # 128 cores / 4 GPUs = 32 workers per process
  num_workers: 32
  pin_memory: true
  prefetch_factor: 4
