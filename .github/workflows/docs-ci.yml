name: docs-ci

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "scripts/architecture/**"
      - "README.md"
      - "MarsHiRISE_Technical_Reference.md"
      - "MarsHiRISE_DTM_Technical_Reference.md"
      - "pyproject.toml"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system deps (graphviz, GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz gdal-bin libgdal-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync docs dependencies
        run: uv sync --extra docs

      - name: Render Graphviz pipeline diagrams (best-effort)
        continue-on-error: true
        run: |
          mkdir -p docs/diagrams
          # These scripts depend on the full training stack; skip silently if imports fail.
          PYTHONPATH=src uv run --extra viz python scripts/architecture/depthfm_pipeline_diagram.py || true
          PYTHONPATH=src uv run --extra viz python scripts/architecture/marsclip_diagram.py || true
          # Collect any SVGs produced under repo root or scripts/architecture into docs/diagrams/
          find . -maxdepth 4 -type f -name "*.svg" \
            -not -path "./.venv/*" -not -path "./site/*" -not -path "./docs/diagrams/*" \
            -exec cp -v {} docs/diagrams/ \; || true

      - name: Build docs
        # NOTE: --strict is currently disabled — pre-existing docstring formatting
        # produces non-fatal griffe warnings. Re-enable once those are cleaned up.
        run: uv run properdocs build

      - name: Upload site artifact (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.event.pull_request.number || github.run_id }}
          path: site/
          retention-days: 7
